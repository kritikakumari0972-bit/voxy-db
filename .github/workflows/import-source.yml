name: Import VoxyDB v0.5.1 source

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'stage VoxyDB v0.5.1 source import')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Expand verified source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/voxydb-source
          cat .voxydb-import/part-*.b64 | tr -d '\r\n ' | base64 --decode > /tmp/voxydb-v0.5.1.tar.xz
          tar -xJf /tmp/voxydb-v0.5.1.tar.xz -C /tmp/voxydb-source
          cp -a /tmp/voxydb-source/. .
          rm -rf .voxydb-import
          rm -f .github/workflows/import-source.yml
          rm -f .github/workflows/ci.yml

      - name: Run project checks
        run: npm run check

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish VoxyDB v0.5.1 source files"
          git push origin HEAD:main
